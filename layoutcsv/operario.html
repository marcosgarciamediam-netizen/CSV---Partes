<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Operario - Registro de Partes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <script>
        (function() {
            const usuarioId = localStorage.getItem('usuario_id');
            const usuarioRol = localStorage.getItem('usuario_rol');
            if (!usuarioId || usuarioRol !== 'operario') {
                alert('⚠️ Acceso no autorizado para este rol.');
                window.location.href = 'index.html';
            }
        })();
    </script>

    <div class="flex h-screen overflow-hidden">
        <div class="flex-1 flex flex-col overflow-hidden w-full">
            <header class="bg-white p-4 md:p-6 shadow-sm flex justify-between items-center z-10 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#ffcc00] rounded-xl flex items-center justify-center font-black text-[#004b87] border-2 border-[#004b87]">CSV</div>
                    <h1 class="text-lg md:text-2xl font-bold text-[#004b87]">Portal del Operario</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span id="nombreUsuarioHeader" class="text-sm font-bold text-[#004b87]">Operario</span>
                    <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 hover:bg-red-100 font-bold text-xs px-3 py-2 rounded-lg transition">🚪 Salir</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-xl mx-auto">
                    <h2 class="text-lg font-bold text-[#004b87] mb-2">Enviar Parte Diario de Trabajo</h2>
                    <p class="text-xs text-gray-600 mb-6">Introduce las horas y tareas realizadas en la obra asignada de hoy.</p>
                    
                    <form id="formParte" onsubmit="enviarParte(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Obra Asignada</label>
                            <select id="obraSelect" required class="w-full border border-gray-300 p-3 rounded-xl text-sm bg-gray-50 focus:border-[#004b87] outline-none">
                                <option value="">Cargando obras...</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Fecha</label>
                                <input type="date" id="fechaInput" required class="w-full border border-gray-300 p-3 rounded-xl text-sm bg-gray-50 focus:border-[#004b87] outline-none" />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Horas Trabajadas</label>
                                <input type="number" id="horasInput" step="0.5" min="0.5" max="24" value="8" required class="w-full border border-gray-300 p-3 rounded-xl text-sm bg-gray-50 focus:border-[#004b87] outline-none" />
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Detalle / Tareas Realizadas</label>
                            <textarea id="tareasInput" rows="3" required placeholder="Describe brevemente el trabajo realizado..." class="w-full border border-gray-300 p-3 rounded-xl text-sm bg-gray-50 focus:border-[#004b87] outline-none"></textarea>
                        </div>
                        
                        <div id="mensajeFeedback" class="hidden p-3 text-xs font-semibold rounded text-center"></div>

                        <button type="submit" id="btnSubmit" class="w-full bg-[#ffcc00] text-[#004b87] font-extrabold text-sm py-3.5 rounded-xl shadow-md hover:bg-yellow-400 transition transform active:scale-[0.99]">
                            🚀 Enviar Parte Diario
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const nombreUser = localStorage.getItem('usuario_nombre');
            if (nombreUser) document.getElementById('nombreUsuarioHeader').textContent = nombreUser;
            
            document.getElementById('fechaInput').value = new Date().toISOString().split('T')[0];
            
            try {
                const res = await fetch('/api/obras');
                const data = await res.json();
                const select = document.getElementById('obraSelect');
                select.innerHTML = '<option value="">-- Selecciona una obra --</option>';
                
                if (data.success) {
                    data.obras.forEach(o => {
                        select.innerHTML += `<option value="${o.id_obra}">${o.nombre}</option>`;
                    });
                }
            } catch (error) {
                console.error("Error cargando obras:", error);
                document.getElementById('obraSelect').innerHTML = '<option value="">Error al cargar obras</option>';
            }
        });

        async function enviarParte(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const feedback = document.getElementById('mensajeFeedback');
            
            const id_usuario = localStorage.getItem('usuario_id');
            const id_obra = document.getElementById('obraSelect').value;
            const fecha = document.getElementById('fechaInput').value;
            const horas = document.getElementById('horasInput').value;
            const tareas = document.getElementById('tareasInput').value;

            btn.disabled = true;
            btn.textContent = 'Enviando...';
            feedback.classList.add('hidden');

            try {
                const res = await fetch('/api/partes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_usuario, id_obra, fecha, horas, tareas })
                });
                const data = await res.json();

                if (data.success) {
                    feedback.textContent = '✅ ¡Parte enviado correctamente!';
                    feedback.className = 'p-3 text-xs font-semibold rounded text-center bg-green-50 text-green-700 block mt-4';
                    document.getElementById('tareasInput').value = ''; 
                } else {
                    feedback.textContent = '❌ Error: ' + (data.error || 'No se pudo guardar el parte');
                    feedback.className = 'p-3 text-xs font-semibold rounded text-center bg-red-50 text-red-700 block mt-4';
                }
            } catch (error) {
                feedback.textContent = '❌ Error de conexión con el servidor.';
                feedback.className = 'p-3 text-xs font-semibold rounded text-center bg-red-50 text-red-700 block mt-4';
            }
            
            btn.disabled = false;
            btn.textContent = '🚀 Enviar Parte Diario';
        }
        
        function cerrarSesion() { 
            localStorage.clear(); 
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
