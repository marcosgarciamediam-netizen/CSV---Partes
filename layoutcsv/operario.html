<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Partes - CSV Construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-[#004b87] w-full max-w-lg space-y-6">
        
        <!-- Cabecera -->
        <div class="flex justify-between items-center border-b pb-4">
            <div>
                <h1 class="text-xl font-extrabold text-[#004b87]">Nuevo Parte de Trabajo</h1>
                <p id="nombreOperario" class="text-xs text-gray-500 font-medium"></p>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-50 text-red-700 border border-red-200 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                Salir
            </button>
        </div>

        <!-- Formulario de Parte -->
        <form id="formParte" onsubmit="enviarParte(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Obra</label>
                <select id="id_obra" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none focus:border-[#004b87] bg-gray-50" required>
                    <option value="">Selecciona una obra...</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Fecha</label>
                    <input type="date" id="fecha" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none focus:border-[#004b87] bg-gray-50" required />
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Horas</label>
                    <input type="number" step="0.5" min="0.5" max="24" id="horas" placeholder="8" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none focus:border-[#004b87] bg-gray-50" required />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Tareas Realizadas</label>
                <textarea id="tareas" rows="3" placeholder="Describe brevemente los trabajos realizados..." class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none focus:border-[#004b87] bg-gray-50 resize-none" required></textarea>
            </div>

            <div id="mensajeAlerta" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

            <button type="submit" class="w-full bg-[#ffcc00] text-[#004b87] font-extrabold text-sm py-3.5 rounded-xl shadow-md hover:bg-yellow-400 transition transform active:scale-[0.99]">
                Registrar Parte
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const idUsuario = localStorage.getItem('usuario_id');
            const nombre = localStorage.getItem('usuario_nombre') || 'Operario';
            document.getElementById('nombreOperario').textContent = `Operario: ${nombre}`;

            if (!idUsuario) {
                alert('Sesión no iniciada correctamente.');
                window.location.href = 'index.html';
                return;
            }

            // Poner fecha de hoy por defecto
            document.getElementById('fecha').valueAsDate = new Date();

            cargarObrasSelect();
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function cargarObrasSelect() {
            try {
                const res = await fetch('/api/obras');
                const data = await res.json();
                const select = document.getElementById('id_obra');

                if (data.success && data.obras.length > 0) {
                    data.obras.forEach(o => {
                        select.innerHTML += `<option value="${o.id_obra}">${o.nombre}</option>`;
                    });
                }
            } catch (err) {
                console.error("Error al cargar obras:", err);
            }
        }

        async function enviarParte(e) {
            e.preventDefault();

            const id_usuario = localStorage.getItem('usuario_id');
            const id_obra = document.getElementById('id_obra').value;
            const fecha = document.getElementById('fecha').value;
            const horas = document.getElementById('horas').value;
            const tareas = document.getElementById('tareas').value;
            const divAlerta = document.getElementById('mensajeAlerta');

            divAlerta.classList.add('hidden');

            try {
                const res = await fetch('/api/partes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_usuario, id_obra, fecha, horas, tareas })
                });

                const data = await res.json();

                if (data.success) {
                    divAlerta.className = "p-3 bg-green-50 border-l-4 border-green-600 text-green-700 text-xs font-semibold rounded";
                    divAlerta.textContent = "✅ ¡Parte registrado correctamente!";
                    divAlerta.classList.remove('hidden');
                    
                    // Limpiar campos de texto y horas
                    document.getElementById('tareas').value = '';
                    document.getElementById('horas').value = '';
                } else {
                    divAlerta.className = "p-3 bg-red-50 border-l-4 border-red-600 text-red-700 text-xs font-semibold rounded";
                    divAlerta.textContent = "❌ Error: " + (data.error || 'No se pudo guardar el parte.');
                    divAlerta.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Error al enviar parte:", err);
                divAlerta.className = "p-3 bg-red-50 border-l-4 border-red-600 text-red-700 text-xs font-semibold rounded";
                divAlerta.textContent = "❌ Error de conexión con el servidor.";
                divAlerta.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
