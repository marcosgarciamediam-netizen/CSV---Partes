<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Encargado - CSV Construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
        <!-- Cabecera -->
        <header class="bg-white p-4 sm:p-6 rounded-2xl shadow-md border-t-4 border-[#004b87] flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-[#004b87]">Panel de Encargado</h1>
                <p class="text-xs text-gray-500">Gestión de cuadrilla y partes de trabajo del equipo</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="nombreEncargado" class="text-sm font-bold text-gray-700"></span>
                <button onclick="cerrarSesion()" class="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Plantilla Asignada -->
            <section class="bg-white p-6 rounded-2xl shadow-md space-y-4">
                <h2 class="text-lg font-extrabold text-[#004b87]">Mi Cuadrilla / Operarios</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 uppercase text-[10px] tracking-wider border-b">
                                <th class="p-3">Código</th>
                                <th class="p-3">Nombre</th>
                                <th class="p-3">Categoría</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPlantillaBody" class="divide-y divide-gray-100 text-xs">
                            <!-- Cargado dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Partes Recientes de la Cuadrilla -->
            <section class="bg-white p-6 rounded-2xl shadow-md space-y-4">
                <h2 class="text-lg font-extrabold text-[#004b87]">Partes Recientes del Equipo</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 uppercase text-[10px] tracking-wider border-b">
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Operario</th>
                                <th class="p-3">Obra</th>
                                <th class="p-3">Horas</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPartesCuadrillaBody" class="divide-y divide-gray-100 text-xs">
                            <!-- Cargado dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const idEncargado = localStorage.getItem('usuario_id');
            const nombre = localStorage.getItem('usuario_nombre') || 'Encargado';
            document.getElementById('nombreEncargado').textContent = `Hola, ${nombre}`;

            if (!idEncargado) {
                alert('Sesión no iniciada correctamente.');
                window.location.href = 'index.html';
                return;
            }

            cargarPlantilla(idEncargado);
            cargarPartesCuadrilla(idEncargado);
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function cargarPlantilla(idEncargado) {
            try {
                const res = await fetch(`/api/encargado/${idEncargado}/plantilla`);
                const data = await res.json();
                const tbody = document.getElementById('tablaPlantillaBody');
                tbody.innerHTML = '';

                if (data.success && data.plantilla.length > 0) {
                    data.plantilla.forEach(op => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b border-gray-50">
                                <td class="p-3 font-mono text-gray-500">${op.codigo_operario || '-'}</td>
                                <td class="p-3 font-bold text-[#004b87]">${op.nombre}</td>
                                <td class="p-3 text-gray-600">${op.categoria || '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">No tienes operarios asignados.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar plantilla:", err);
            }
        }

        async function cargarPartesCuadrilla(idEncargado) {
            try {
                const res = await fetch(`/api/encargado/${idEncargado}/partes`);
                const data = await res.json();
                const tbody = document.getElementById('tablaPartesCuadrillaBody');
                tbody.innerHTML = '';

                if (data.success && data.partes.length > 0) {
                    data.partes.forEach(p => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b border-gray-50">
                                <td class="p-3">${p.fecha ? p.fecha.split('T')[0] : '-'}</td>
                                <td class="p-3 font-bold text-[#004b87]">${p.operario_nombre}</td>
                                <td class="p-3">${p.obra_nombre}</td>
                                <td class="p-3 font-semibold">${p.horas}h</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No hay partes recientes registrados.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar partes de cuadrilla:", err);
            }
        }
    </script>
</body>
</html>
