<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Encargado - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <script>
        (function() {
            const usuarioId = localStorage.getItem('usuario_id');
            const usuarioRol = (localStorage.getItem('usuario_rol') || '').toLowerCase().trim();
            
            if (!usuarioId || usuarioRol !== 'encargado') {
                localStorage.clear();
                alert('⚠️ Acceso no autorizado. Debes iniciar sesión como encargado.');
                window.location.replace('index.html');
            }
        })();
    </script>

    <div class="flex h-screen overflow-hidden">
        <div class="flex-1 flex flex-col overflow-hidden w-full">
            <header class="bg-white p-4 md:p-6 shadow-sm flex justify-between items-center z-10 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#ffcc00] rounded-xl flex items-center justify-center font-black text-[#004b87] border-2 border-[#004b87]">CSV</div>
                    <h1 class="text-lg md:text-2xl font-bold text-[#004b87]">Panel de Encargado</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span id="nombreUsuarioHeader" class="text-sm font-bold text-[#004b87]">Encargado</span>
                    <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 hover:bg-red-100 font-bold text-xs px-3 py-2 rounded-lg transition">🚪 Salir</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 space-y-6">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- Columna Izquierda: Registrar parte para un operario de la plantilla -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-1 space-y-4">
                        <h2 class="text-lg font-bold text-[#004b87]">Registrar Parte de Cuadrilla</h2>
                        <p class="text-xs text-gray-600">Selecciona un trabajador de tu plantilla para imputarle horas.</p>
                        
                        <form id="formParteEncargado" onsubmit="enviarParteEncargado(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Trabajador</label>
                                <select id="selectOperario" required class="w-full border p-2.5 rounded-xl text-sm bg-gray-50">
                                    <option value="">Cargando plantilla...</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Obra</label>
                                <select id="selectObra" required class="w-full border p-2.5 rounded-xl text-sm bg-gray-50">
                                    <option value="">Cargando obras...</option>
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Fecha</label>
                                    <input type="date" id="inputFecha" required class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Horas</label>
                                    <input type="number" id="inputHoras" step="0.5" min="0.5" max="24" value="8" required class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" />
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#004b87] uppercase mb-1">Tareas / Detalles</label>
                                <textarea id="inputTareas" rows="2" required placeholder="Descripción de las labores..." class="w-full border p-2.5 rounded-xl text-sm bg-gray-50"></textarea>
                            </div>

                            <div id="mensajeFeedback" class="hidden p-2 text-xs font-semibold rounded text-center"></div>

                            <button type="submit" id="btnEnviar" class="w-full bg-[#ffcc00] text-[#004b87] font-extrabold text-sm py-3 rounded-xl shadow-md hover:bg-yellow-400 transition">
                                🚀 Registrar Parte
                            </button>
                        </form>
                    </div>

                    <!-- Columna Derecha: Historial y supervisión de partes recientes de la cuadrilla con paginación -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-2 flex flex-col">
                        <h2 class="text-lg font-bold text-[#004b87] mb-2">Últimos Partes de la Cuadrilla</h2>
                        <p class="text-xs text-gray-600 mb-4">Supervisión en tiempo real de la actividad registrada por tus operarios.</p>
                        
                        <div id="listaPartesCuadrilla" class="space-y-3 overflow-y-auto flex-1 max-h-[450px] pr-1">
                            <div class="p-4 text-center text-sm text-gray-400">Cargando partes...</div>
                        </div>

                        <!-- Controles de Paginación -->
                        <div id="paginacionContenedor" class="flex justify-between items-center mt-4 pt-3 border-t border-gray-200 hidden">
                            <button onclick="cambiarPagina(-1)" id="btnAnterior" class="bg-gray-100 text-[#004b87] font-bold text-xs px-4 py-2 rounded-lg hover:bg-gray-200 transition">◀ Anterior</button>
                            <span id="textoPaginacion" class="text-xs font-semibold text-gray-600">Página 1 de 1</span>
                            <button onclick="cambiarPagina(1)" id="btnSiguiente" class="bg-gray-100 text-[#004b87] font-bold text-xs px-4 py-2 rounded-lg hover:bg-gray-200 transition">Siguiente ▶</button>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <script>
        let partesGlobal = [];
        let listaObrasGlobal = [];
        let paginaActual = 1;
        const elementosPorPagina = 20;

        document.addEventListener('DOMContentLoaded', async () => {
            const nombreUser = localStorage.getItem('usuario_nombre');
            const idEncargado = localStorage.getItem('usuario_id');
            if (nombreUser) document.getElementById('nombreUsuarioHeader').textContent = nombreUser;
            
            document.getElementById('inputFecha').value = new Date().toISOString().split('T')[0];

            await cargarPlantillaYObra(idEncargado);
            await cargarPartesCuadrilla(idEncargado);
        });

        async function cargarPlantillaYObra(idEncargado) {
            try {
                const resPlantilla = await fetch(`/api/encargado/${idEncargado}/plantilla`);
                const dataPlantilla = await resPlantilla.json();
                const selectOp = document.getElementById('selectOperario');
                selectOp.innerHTML = '<option value="">-- Selecciona operario --</option>';
                
                if (dataPlantilla.success && dataPlantilla.plantilla.length > 0) {
                    dataPlantilla.plantilla.forEach(op => {
                        selectOp.innerHTML += `<option value="${op.id_usuario}">${op.nombre} (${op.categoria || 'General'})</option>`;
                    });
                } else {
                    selectOp.innerHTML = '<option value="">No tienes operarios asignados</option>';
                }

                const resObras = await fetch('/api/obras');
                const dataObras = await resObras.json();
                const selectObra = document.getElementById('selectObra');
                selectObra.innerHTML = '<option value="">-- Selecciona obra --</option>';
                
                if (dataObras.success) {
                    listaObrasGlobal = dataObras.obras;
                    listaObrasGlobal.forEach(o => {
                        selectObra.innerHTML += `<option value="${o.id_obra}">${o.nombre}</option>`;
                    });
                }
            } catch (error) {
                console.error("Error al cargar datos del encargado:", error);
            }
        }

        async function cargarPartesCuadrilla(idEncargado) {
            try {
                const res = await fetch(`/api/encargado/${idEncargado}/partes`);
                const data = await res.json();

                if (data.success) {
                    partesGlobal = data.partes;
                    paginaActual = 1;
                    renderizarTablaPartes();
                }
            } catch (error) {
                console.error("Error cargando partes:", error);
            }
        }

        function renderizarTablaPartes() {
            const contenedor = document.getElementById('listaPartesCuadrilla');
            const contenedorPaginacion = document.getElementById('paginacionContenedor');
            contenedor.innerHTML = '';

            if (partesGlobal.length === 0) {
                contenedor.innerHTML = '<div class="p-6 bg-gray-50 text-center text-sm text-gray-500 border rounded-lg">No hay partes registrados recientes en tu cuadrilla.</div>';
                contenedorPaginacion.classList.add('hidden');
                return;
            }

            contenedorPaginacion.classList.remove('hidden');

            const totalPaginas = Math.ceil(partesGlobal.length / elementosPorPagina);
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            if (paginaActual < 1) paginaActual = 1;

            const inicio = (paginaActual - 1) * elementosPorPagina;
            const fin = inicio + elementosPorPagina;
            const partesPagina = partesGlobal.slice(inicio, fin);

            partesPagina.forEach(p => {
                const fechaFormateada = new Date(p.fecha).toLocaleDateString('es-ES');
                contenedor.innerHTML += `
                    <div class="border border-gray-200 rounded-lg p-4 bg-white hover:shadow-sm transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 relative">
                        <div>
                            <div class="font-bold text-gray-800 text-sm">${p.operario_nombre}</div>
                            <div class="text-xs font-semibold text-[#004b87]">🏗️ ${p.obra_nombre} <span class="text-gray-400 font-normal">| 📅 ${fechaFormateada}</span></div>
                            <div class="text-xs text-gray-600 mt-1 bg-gray-50 p-2 rounded">${p.tareas}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="bg-blue-50 text-[#004b87] px-3 py-1.5 rounded-lg font-black text-sm shrink-0">
                                ${p.horas}h
                            </div>
                            <button onclick="editarParte(${p.id_parte}, ${p.horas}, '${p.tareas.replace(/'/g, "\\'")}', ${p.id_obra})" class="bg-yellow-50 hover:bg-yellow-100 text-[#004b87] p-2 rounded-lg text-xs font-bold transition" title="Editar parte">✏️</button>
                            <button onclick="eliminarParte(${p.id_parte})" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 rounded-lg text-xs font-bold transition" title="Eliminar parte">🗑️</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('textoPaginacion').textContent = `Página ${paginaActual} de ${totalPaginas || 1}`;
            document.getElementById('btnAnterior').disabled = paginaActual === 1;
            document.getElementById('btnSiguiente').disabled = paginaActual >= totalPaginas;
        }

        function cambiarPagina(direccion) {
            paginaActual += direccion;
            renderizarTablaPartes();
        }

        async function editarParte(idParte, horasActuales, tareasActuales, obraActual) {
            const nuevasHoras = prompt("Modificar horas trabajadas:", horasActuales);
            if (nuevasHoras === null) return;

            const nuevasTareas = prompt("Modificar descripción de tareas:", tareasActuales);
            if (nuevasTareas === null) return;

            let listaTextoObras = listaObrasGlobal.map(o => `${o.id_obra} -> ${o.nombre}`).join('\n');
            const nuevaObra = prompt(`Introduce el ID de la nueva obra:\n\n${listaTextoObras}`, obraActual);
            if (nuevaObra === null) return;

            const horasLimpias = parseFloat(nuevasHoras.replace(',', '.'));
            const obraLimpia = parseInt(nuevaObra);

            if (isNaN(horasLimpias) || isNaN(obraLimpia)) {
                alert('❌ Datos incorrectos. Revisa las horas o el ID de obra.');
                return;
            }

            try {
                const respuesta = await fetch(`/api/partes/${idParte}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ horas: horasLimpias, tareas: nuevasTareas, id_obra: obraLimpia })
                });

                const resultado = await respuesta.json();
                if (resultado.success) {
                    alert('✅ ¡Parte modificado correctamente!');
                    const idEncargado = localStorage.getItem('usuario_id');
                    await cargarPartesCuadrilla(idEncargado);
                } else {
                    alert('❌ Error al modificar el parte.');
                }
            } catch (error) {
                console.error('Error de conexión al editar:', error);
                alert('❌ No se pudo conectar con el servidor.');
            }
        }

        async function eliminarParte(idParte) {
            // Doble confirmación de seguridad solicitada
            if (!confirm("⚠️ ¿Estás seguro de que deseas eliminar este parte?")) {
                return;
            }
            if (!confirm("❌ Esta acción es irreversible. Haz clic en Aceptar para confirmar la eliminación.")) {
                return;
            }

            try {
                const respuesta = await fetch(`/api/partes/${idParte}`, {
                    method: 'DELETE'
                });

                const resultado = await respuesta.json();
                if (resultado.success) {
                    alert('✅ ¡Parte eliminado correctamente!');
                    const idEncargado = localStorage.getItem('usuario_id');
                    await cargarPartesCuadrilla(idEncargado);
                } else {
                    alert('❌ Error al eliminar el parte: ' + (resultado.error || 'No se pudo completar'));
                }
            } catch (error) {
                console.error('Error de conexión al eliminar:', error);
                alert('❌ No se pudo conectar con el servidor.');
            }
        }

        async function enviarParteEncargado(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const feedback = document.getElementById('mensajeFeedback');
            const idEncargado = localStorage.getItem('usuario_id');

            const payload = {
                id_usuario: document.getElementById('selectOperario').value,
                id_obra: document.getElementById('selectObra').value,
                fecha: document.getElementById('inputFecha').value,
                horas: document.getElementById('inputHoras').value,
                tareas: document.getElementById('inputTareas').value
            };

            btn.disabled = true;
            btn.textContent = 'Enviando...';
            feedback.classList.add('hidden');

            try {
                const res = await fetch('/api/partes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    feedback.textContent = '✅ Parte registrado con éxito';
                    feedback.className = 'p-2 text-xs font-semibold rounded text-center bg-green-50 text-green-700 block mb-2';
                    document.getElementById('inputTareas').value = '';
                    await cargarPartesCuadrilla(idEncargado); 
                } else {
                    feedback.textContent = '❌ Error: ' + (data.error || 'No se pudo guardar');
                    feedback.className = 'p-2 text-xs font-semibold rounded text-center bg-red-50 text-red-700 block mb-2';
                }
            } catch (error) {
                feedback.textContent = '❌ Error de conexión con el servidor.';
                feedback.className = 'p-2 text-xs font-semibold rounded text-center bg-red-50 text-red-700 block mb-2';
            }

            btn.disabled = false;
            btn.textContent = '🚀 Registrar Parte';
        }

        function cerrarSesion() { 
            localStorage.clear(); 
            window.location.replace('index.html'); 
        }
    </script>
</body>
</html>
