<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Jefe de Obra - CSV Construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        <!-- Cabecera -->
        <header class="bg-white p-4 sm:p-6 rounded-2xl shadow-md border-t-4 border-[#004b87] flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-[#004b87]">Panel de Jefe de Obra</h1>
                <p class="text-xs text-gray-500">Consulta de obras asignadas y seguimiento de proyectos</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="nombreJefe" class="text-sm font-bold text-gray-700"></span>
                <button onclick="cerrarSesion()" class="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <!-- Obras Asignadas -->
        <main class="bg-white p-6 rounded-2xl shadow-md space-y-4">
            <h2 class="text-lg font-extrabold text-[#004b87]">Mis Obras Asignadas</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-[10px] tracking-wider border-b">
                            <th class="p-3">ID Obra</th>
                            <th class="p-3">Nombre de la Obra</th>
                        </tr>
                    </thead>
                    <tbody id="tablaObrasJefeBody" class="divide-y divide-gray-100 text-xs">
                        <!-- Cargado dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const idJefe = localStorage.getItem('usuario_id');
            const nombre = localStorage.getItem('usuario_nombre') || 'Jefe de Obra';
            document.getElementById('nombreJefe').textContent = `Hola, ${nombre}`;

            if (!idJefe) {
                alert('Sesión no iniciada correctamente.');
                window.location.href = 'index.html';
                return;
            }

            cargarObrasJefe(idJefe);
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function cargarObrasJefe(idJefe) {
            try {
                const res = await fetch(`/api/jefe/${idJefe}/obras`);
                const data = await res.json();
                const tbody = document.getElementById('tablaObrasJefeBody');
                tbody.innerHTML = '';

                if (data.success && data.obras.length > 0) {
                    data.obras.forEach(o => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b border-gray-50">
                                <td class="p-3 font-mono text-gray-500">${o.id_obra}</td>
                                <td class="p-3 font-bold text-[#004b87]">${o.nombre}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-gray-400">No tienes obras asignadas actualmente.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar obras del jefe:", err);
            }
        }
    </script>
</body>
</html>
